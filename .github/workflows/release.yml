name: Release

# Builds the Flatpak and the source tarball on every change. A version tag
# (vX.Y.Z, matching Cargo.toml) publishes both: the signed Flatpak repository
# on GitHub Pages, and a GitHub release with the bundle, the tarball, their
# checksums and the notes from the metainfo. "Run workflow" publishes the
# repository only. docs/releasing.md has the steps.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.cszach.Calliope
  MANIFEST: build-aux/flatpak/io.github.cszach.Calliope.yml

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint the manifest
        run: flatpak-builder-lint --exceptions --user-exceptions build-aux/flatpak/lint-exceptions.json manifest "$MANIFEST"

      - uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('build-aux/flatpak/*', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: flatpak-builder-${{ hashFiles('build-aux/flatpak/*', 'Cargo.lock') }}-

      - name: Build
        run: >
          flatpak-builder --repo=repo --default-branch=stable --force-clean
          --disable-rofiles-fuse --install-deps-from=flathub
          build "$MANIFEST"

      - name: Lint the build
        run: flatpak-builder-lint --exceptions --user-exceptions build-aux/flatpak/lint-exceptions.json repo repo

      - name: Bundle
        run: >
          flatpak build-bundle repo calliope.flatpak "$APP_ID" stable
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v7
        with:
          name: calliope-flatpak
          path: calliope.flatpak

      - name: Decide whether to publish
        id: publish
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is not set, so the repository cannot be signed"
            exit 1
          fi
          echo publish=true >> "$GITHUB_OUTPUT"

      - name: Sign and lay out the site
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          PUBLISH: ${{ steps.publish.outputs.publish }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          if [ "$PUBLISH" = true ]; then
            printf '%s\n' "$KEY" | gpg --batch --import
          else
            # A trial run with a throwaway key, served from localhost, so
            # every change exercises the script and the site can be tried.
            gpg --batch --passphrase '' --quick-gen-key 'Calliope trial' rsa2048 sign never
            export CHECK_KEY=0 SITE=http://localhost:8000
          fi
          build-aux/flatpak/publish.sh repo public
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-artifact@v7
        if: steps.publish.outputs.publish != 'true'
        with:
          name: calliope-site-trial
          path: public
          include-hidden-files: true

      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.publish == 'true'
        with:
          path: public

  source:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # The packages README.md lists, plus git, xz and appstream for the
      # tarball and the notes.
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git make gcc cargo gtk4-devel libadwaita-devel webkitgtk6.0-devel
          xz appstream
      - uses: actions/checkout@v7

      # deploy waits for this job, so a mismatched tag publishes nothing.
      - name: Check the version
        run: |
          version=$(build-aux/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Make the source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make dist

      - name: Build the tarball offline
        run: |
          mkdir /tmp/fresh
          tar -xJf "target/dist/calliope-$VERSION.tar.xz" -C /tmp/fresh
          cd "/tmp/fresh/calliope-$VERSION"
          CARGO_NET_OFFLINE=true make build

      - name: Write the release notes
        run: build-aux/release-notes.sh "$VERSION" > target/dist/release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: calliope-source
          path: target/dist

  # The bundle installed as a new user would, into a fresh home with
  # nothing but Flathub's runtime, and run in headless desktops. Not a gate
  # for publishing: it depends on muse.ai answering.
  smoke:
    needs: flatpak
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install Flatpak and a headless desktop
        run: >
          dnf install -y --setopt=install_weak_deps=False
          flatpak gnome-shell xorg-x11-server-Xvfb ImageMagick python3-gobject dbus-daemon
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: calliope-flatpak
      - name: Run the Flatpak in headless desktops
        shell: bash
        run: scripts/smoke.py --flatpak calliope.flatpak --out smoke | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-flatpak
          path: smoke

  deploy:
    # The source job too: a tag whose tarball or notes fail publishes
    # nothing, rather than a Flatpak update with no release.
    needs: [flatpak, source]
    if: needs.flatpak.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: [flatpak, source, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: calliope-flatpak
      - uses: actions/download-artifact@v8
        with:
          name: calliope-source

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          mv calliope.flatpak "calliope-$version-x86_64.flatpak"
          sha256sum "calliope-$version-x86_64.flatpak" "calliope-$version.tar.xz" > SHA256SUMS
          {
            cat release-notes.md
            printf '\n## Install\n\n'
            printf '```sh\nflatpak install --user https://zachnguyen.com/calliope/calliope.flatpakref\n```\n\n'
            printf 'Updates then arrive with your other Flatpak apps. To build from source, use\n'
            printf 'calliope-%s.tar.xz, which has every crate vendored, and follow the README.\n' "$version"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Calliope $version" --notes-file notes.md \
            "calliope-$version-x86_64.flatpak" "calliope-$version.tar.xz" SHA256SUMS

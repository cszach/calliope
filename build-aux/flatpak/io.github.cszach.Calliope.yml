id: io.github.cszach.Calliope
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: calliope
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The microphone, for Muse's voice mode.
  - --socket=pulseaudio
  - --filesystem=xdg-download
modules:
  - name: calliope
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/calliope/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/calliope -t /app/bin
      # Flatpak rewrites Exec lines on export; the D-Bus service needs a full path.
      - sed 's|@BINDIR@/||' data/${FLATPAK_ID}.desktop.in > ${FLATPAK_ID}.desktop
      - sed 's|@BINDIR@|/app/bin|' data/${FLATPAK_ID}.service.in > ${FLATPAK_ID}.service
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.service -t /app/share/dbus-1/services
      - install -Dm644 data/${FLATPAK_ID}.search-provider.ini -t /app/share/gnome-shell/search-providers
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          # Fetched by `make fetch-icon` for personal use; never shipped.
          - data/icons/official
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
      - cargo-sources.json
